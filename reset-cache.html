<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar PILE OF SHAME</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07131b;color:#eee;font-family:system-ui;text-align:center;padding:24px}strong{font-size:1.25rem}p{color:#9fb0ba}</style></head>
<body><div><strong>Actualizando PILE OF SHAME…</strong><p>Limpiando versiones antiguas. No se borran tus datos locales.</p></div>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k)));
  }
 }catch(e){console.error(e)}
 setTimeout(()=>location.replace('./?v=9.4'),700);
})();
</script></body></html>
