<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17141f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HobbyCircle" />
  <title>HobbyCircle</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">HOBBY CIRCLE</div>
        <h1 id="screenTitle">Feed</h1>
      </div>
      <button class="icon-btn" id="notifBtn" aria-label="Notificaciones">
        <span>🔔</span><span class="dot"></span>
      </button>
    </header>

    <main id="app" class="content"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="feed" class="nav-item active"><span>⌂</span><small>Feed</small></button>
      <button data-route="collection" class="nav-item"><span>▦</span><small>Colección</small></button>
      <button data-route="add" class="nav-item add-nav"><span>＋</span><small>Añadir</small></button>
      <button data-route="community" class="nav-item"><span>◉</span><small>Comunidad</small></button>
      <button data-route="profile" class="nav-item"><span>☺</span><small>Perfil</small></button>
    </nav>
  </div>

  <dialog id="notificationsDialog" class="modal">
    <div class="modal-head">
      <h2>Notificaciones</h2>
      <button class="icon-btn" data-close="notificationsDialog">✕</button>
    </div>
    <div class="stack">
      <div class="notice"><strong>Laura</strong> ha reaccionado a tu proyecto Orkos. <span>Hace 8 min</span></div>
      <div class="notice"><strong>Marta</strong> ha terminado una miniatura. <span>Hace 1 h</span></div>
      <div class="notice"><strong>Ana</strong> comentó tu publicación. <span>Ayer</span></div>
    </div>
  </dialog>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
